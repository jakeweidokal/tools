<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Viewer | PostHog-inspired</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="posthog-theme">
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="home-link">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <h1>SVG Viewer</h1>
      </div>

      <div class="sidebar-section">
        <label for="svg-input" class="section-label">Paste SVG XML</label>
        <textarea id="svg-input" class="code-input" placeholder="<svg ...>...</svg>"></textarea>
      </div>

      <div class="sidebar-section">
        <label class="section-label">Or upload a file</label>
        <div class="file-upload-wrapper">
          <input type="file" id="svg-upload" accept=".svg" class="file-input">
          <label for="svg-upload" class="button button-secondary full-width">Choose .svg file</label>
        </div>
      </div>

      <div class="sidebar-section">
        <label class="section-label">Viewport Controls</label>
        <div class="control-grid">
          <button id="zoom-in" class="button button-primary" title="Zoom In (+)">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <button id="zoom-out" class="button button-primary" title="Zoom Out (-)">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <button id="reset-view" class="button button-secondary" title="Reset View (R)">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          </button>
        </div>
        <div class="pan-controls">
          <button id="pan-up" class="button button-tertiary" title="Pan Up (↑)">↑</button>
          <div class="pan-mid">
            <button id="pan-left" class="button button-tertiary" title="Pan Left (←)">←</button>
            <button id="pan-right" class="button button-tertiary" title="Pan Right (→)">→</button>
          </div>
          <button id="pan-down" class="button button-tertiary" title="Pan Down (↓)">↓</button>
        </div>
      </div>

      <div class="sidebar-section info-section">
        <div class="stat">
          <span class="stat-label">Zoom level</span>
          <span id="zoom-level" class="stat-value">100%</span>
        </div>
        <div class="hotkeys-guide">
          <p><strong>Hotkeys:</strong> <kbd>+/-</kbd> <kbd>↑↓←→</kbd> <kbd>R</kbd> <kbd>Space+Drag</kbd></p>
        </div>
      </div>

      <div class="sidebar-footer">
        <button id="copy-svg" class="button button-secondary full-width">Copy to clipboard</button>
      </div>
    </aside>

    <main class="viewer-area">
      <div id="viewer-container" class="viewer-container">
        <div id="placeholder" class="placeholder">
          <div class="placeholder-content">
            <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.3"><path d="M4 22h14a2 2 0 0 0 2-2V7.5L14.5 2H6a2 2 0 0 0-2 2v4"/><polyline points="14 2 14 8 20 8"/><path d="M2 15h10"/><path d="m9 18 3-3-3-3"/></svg>
            <p>Paste SVG XML or upload a file to get started</p>
          </div>
        </div>
        <div id="svg-viewer" class="svg-viewer" style="display: none;">
          <div id="svg-content" class="svg-content"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
